  nameWithType: WssStimulationCoreOptions
  fullName: Wss.CoreModule.WssStimulationCoreOptions
  type: Class
  assemblies:
  - WSS_Core_Interface
  namespace: Wss.CoreModule
  summary: Holds startup and default stimulation settings for <xref href="Wss.CoreModule.WssStimulationCore" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    These values affect configuration loading, setup retry behavior, and the default schedule/event values used

    during the core's initial device setup. Packet spacing is intentionally not exposed here because it remains a

    fixed hardware/radio constraint in the core implementation.

    The core constructor requires a non-empty <xref href="Wss.CoreModule.WssStimulationCoreOptions.ConfigPath" data-throw-if-not-resolved="false"></xref> and validates that

    <xref href="Wss.CoreModule.WssStimulationCoreOptions.MaxSetupTries" data-throw-if-not-resolved="false"></xref> is at least 1.
  example: []
  syntax:
    content: public sealed class WssStimulationCoreOptions
    content.vb: Public NotInheritable Class WssStimulationCoreOptions
  inheritance:
