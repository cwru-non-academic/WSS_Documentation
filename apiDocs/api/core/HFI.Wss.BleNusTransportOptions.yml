    When <xref href="HFI.Wss.BleNusTransportOptions.AutoSelectDevice" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>, callers must provide either

    <xref href="HFI.Wss.BleNusTransportOptions.DeviceId" data-throw-if-not-resolved="false"></xref> or <xref href="HFI.Wss.BleNusTransportOptions.DeviceName" data-throw-if-not-resolved="false"></xref>. Scan-based operations honor <xref href="HFI.Wss.BleNusTransportOptions.ScanTimeout" data-throw-if-not-resolved="false"></xref>

    when a timeout is configured.
