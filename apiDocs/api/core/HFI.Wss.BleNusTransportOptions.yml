- uid: HFI.Wss.BleNusTransportOptions.AutoSelectDevice
  commentId: P:HFI.Wss.BleNusTransportOptions.AutoSelectDevice
  id: AutoSelectDevice
  parent: HFI.Wss.BleNusTransportOptions
  langs:
  - csharp
  - vb
  name: AutoSelectDevice
  nameWithType: BleNusTransportOptions.AutoSelectDevice
  fullName: HFI.Wss.BleNusTransportOptions.AutoSelectDevice
  type: Property
  assemblies:
  - WSS.Transport.BLE
  namespace: HFI.Wss
  summary: >-
    When true, scans for compatible BLE devices and auto-selects the best valid candidate.

    Auto-selection only accepts devices that expose the configured service and both required

    characteristics with the expected properties, then prefers stronger RSSI.

    When false, the caller must provide <xref href="HFI.Wss.BleNusTransportOptions.DeviceId" data-throw-if-not-resolved="false"></xref> or <xref href="HFI.Wss.BleNusTransportOptions.DeviceName" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public bool AutoSelectDevice { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AutoSelectDevice As Boolean
  overload: HFI.Wss.BleNusTransportOptions.AutoSelectDevice*
