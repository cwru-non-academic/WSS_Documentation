  summary: >-
    Gets or sets the explicit port name.

    Use values such as <code>COM5</code> on Windows or <code>/dev/ttyUSB0</code> on Linux/macOS.

    This must be provided when <xref href="Wss.Transports.SerialPortTransportOptions.AutoSelectPort" data-throw-if-not-resolved="false"></xref> is false.
