  type: Method
  assemblies:
  - WSS.Transport.Serial
  namespace: Wss.CoreModule
  summary: Opens/initializes the transport connection (e.g., open a serial port, connect a socket, start BLE session).
  remarks: Opens the serial port and starts a background read loop that forwards incoming data to <xref href="Wss.CoreModule.SerialPortTransport.BytesReceived" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public Task ConnectAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
      description: Optional cancellation token to abort the connect attempt.
    return:
      type: System.Threading.Tasks.Task
      description: A task that completes when the transport is connected.
    content.vb: Public Function ConnectAsync(ct As CancellationToken = Nothing) As Task
  overload: Wss.CoreModule.SerialPortTransport.ConnectAsync*
  exceptions:
