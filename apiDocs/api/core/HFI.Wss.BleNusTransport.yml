  name: BleNusTransport
  nameWithType: BleNusTransport
  fullName: HFI.Wss.BleNusTransport
  type: Class
  assemblies:
  - WSS.Transport.BLE
  namespace: HFI.Wss
  summary: BLE transport backed by the Nordic UART Service (NUS).
  remarks: >-
    This is a low-level byte transport only. Outbound messages are written with response

    to the NUS RX characteristic, inbound messages arrive as notifications from the NUS

    TX characteristic, and writes are serialized so only one GATT write is in flight at a time.

    Device selection follows <xref href="HFI.Wss.BleNusTransportOptions.AutoSelectDevice" data-throw-if-not-resolved="false"></xref>:

    when enabled, the transport scans for compatible BLE devices and chooses the best

    valid candidate; otherwise it requires an explicit <xref href="HFI.Wss.BleNusTransportOptions.DeviceId" data-throw-if-not-resolved="false"></xref>

    or <xref href="HFI.Wss.BleNusTransportOptions.DeviceName" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public sealed class BleNusTransport : ITransport'
    content.vb: Public NotInheritable Class BleNusTransport Implements ITransport
  inheritance:
  - System.Object
  implements:
  - Wss.CoreModule.ITransport
