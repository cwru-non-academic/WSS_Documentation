  namespace: Wss.CoreModule
  summary: Describes a streaming update for PA, PW, and IPI groups.
  remarks: >-
    The protocol supports omitting at most one of the three groups. Each supplied array must contain exactly

    three values, one per streamed schedule slot. The request itself is required by

    <xref href="Wss.CoreModule.WssClient.StreamChange(Wss.CoreModule.StreamChangeRequest%2cWss.CoreModule.WssTarget%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.
