  name: CreateEventRequest
  nameWithType: CreateEventRequest
  fullName: Wss.CoreModule.CreateEventRequest
  type: Class
  assemblies:
  - WSS_Core_Interface
  namespace: Wss.CoreModule
  summary: Describes an event to create on the WSS device.
  remarks: >-
    This request supports the same payload shapes as the previous overload set:

    basic event, event with explicit shape IDs, event with amplitude and pulse-width data,

    or event with both shape and amplitude data.

    <xref href="Wss.CoreModule.CreateEventRequest.StandardShapeId" data-throw-if-not-resolved="false"></xref> and <xref href="Wss.CoreModule.CreateEventRequest.RechargeShapeId" data-throw-if-not-resolved="false"></xref> must be supplied together.

    <xref href="Wss.CoreModule.CreateEventRequest.StandardAmplitudes" data-throw-if-not-resolved="false"></xref> and <xref href="Wss.CoreModule.CreateEventRequest.RechargeAmplitudes" data-throw-if-not-resolved="false"></xref> must be supplied together.

    <xref href="Wss.CoreModule.CreateEventRequest.PulseWidths" data-throw-if-not-resolved="false"></xref> is required when amplitude arrays are supplied, and amplitude arrays are required

    when <xref href="Wss.CoreModule.CreateEventRequest.PulseWidths" data-throw-if-not-resolved="false"></xref> is supplied.
  example: []
  syntax:
    content: public sealed class CreateEventRequest
    content.vb: Public NotInheritable Class CreateEventRequest
  inheritance:
  - System.Object
