- uid: Wss.CoreModule.WssClientOptions.WssTargets
  commentId: P:Wss.CoreModule.WssClientOptions.WssTargets
  id: WssTargets
  parent: Wss.CoreModule.WssClientOptions
  langs:
  - csharp
  - vb
  name: WssTargets
  nameWithType: WssClientOptions.WssTargets
  fullName: Wss.CoreModule.WssClientOptions.WssTargets
  type: Property
  assemblies:
  - WSS_Core_Interface
  namespace: Wss.CoreModule
  summary: >-
    Gets or sets the on-wire receiver addresses for logical <xref href="Wss.CoreModule.WssTarget.Wss1" data-throw-if-not-resolved="false"></xref>,

    <xref href="Wss.CoreModule.WssTarget.Wss2" data-throw-if-not-resolved="false"></xref>, and <xref href="Wss.CoreModule.WssTarget.Wss3" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Index 0 maps to <xref href="Wss.CoreModule.WssTarget.Wss1" data-throw-if-not-resolved="false"></xref>, index 1 to <xref href="Wss.CoreModule.WssTarget.Wss2" data-throw-if-not-resolved="false"></xref>, and index 2 to

    <xref href="Wss.CoreModule.WssTarget.Wss3" data-throw-if-not-resolved="false"></xref>. When null or shorter than three entries, the client falls back to the

    historical defaults for missing values.
  example: []
  syntax:
    content: public byte[] WssTargets { get; set; }
    parameters: []
    return:
      type: System.Byte[]
    content.vb: Public Property WssTargets As Byte()
  overload: Wss.CoreModule.WssClientOptions.WssTargets*
